[package]
name = "gearmaster-lab"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# Where the privileged and the blind meet, and the only place they may.
#
# A benchmark stands a run in front of the pilot and afterwards walks the
# ladder to say how the board did. The first half needs the engine, the second
# needs the oracle, and the pilot in the middle needs neither - which is the
# whole point, and why this crate exists rather than the agent growing a
# dependency.
# The framework is **off by default and never in CI**.
#
# `cargo test --workspace` never compiles it, which is the plan's §2 rule and
# the reason it sits here rather than in the agent: the pilot must stay a crate
# that links one thing.
[features]
nn = ["dep:burn"]

[dependencies]
burn = { version = "0.20", default-features = false, features = [
    "ndarray",
    "autodiff",
    "std",
], optional = true }
gearmaster-engine = { path = "../engine" }
gearmaster-console = { path = "../console" }
gearmaster-oracle = { path = "../oracle" }
gearmaster-agent = { path = "../agent" }
gearmaster-trades = { path = "../trades" }
