<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Gear Master</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #08080c; color: #d8dae8;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* The canvas fills the window at 1:1 CSS pixels. The game letterboxes its
     own fixed 1600x980 layout inside whatever it gets, so no CSS transform is
     involved — which matters, because a transform would break mouse mapping. */
  #glcanvas { display: block; width: 100vw; height: 100vh; outline: none; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: #08080c; z-index: 10;
  }
  #loading .title { font-size: 26px; letter-spacing: 3px; color: #f0c85a; }
  #loading .sub { font-size: 13px; color: #6a6a80; }

  /* The soundtrack. SoundCloud's own widget, streamed from SoundCloud - the
     game itself has no audio engine and nothing is bundled. It sits over a
     corner of the letterbox and can be folded away if it is in the way. */
  #music {
    position: fixed; right: 12px; bottom: 12px; z-index: 20;
    width: 360px; border: 1px solid #3a3a52; border-radius: 6px;
    background: #12121c; overflow: hidden;
  }
  #music.folded #sc { display: none; }
  #music header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; font-size: 12px; letter-spacing: 1px; color: #8a8aa4;
    cursor: pointer; user-select: none;
  }
  #music header:hover { color: #f0c85a; }
  /* The volume row stays put when the player is folded away: somebody who has
     hidden the widget because it is in the way is exactly the person who still
     wants to turn it down. */
  #vol-row {
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px 8px; font-size: 11px; letter-spacing: 1px; color: #6a6a80;
  }
  #mute {
    background: none; border: 1px solid #3a3a52; border-radius: 3px;
    color: #8a8aa4; font: inherit; letter-spacing: 1px; cursor: pointer;
    padding: 2px 7px; min-width: 52px;
  }
  #mute:hover { color: #f0c85a; border-color: #f0c85a; }
  #vol { flex: 1; accent-color: #f0c85a; cursor: pointer; height: 14px; }
  #vol-read { min-width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
  #sc { display: block; width: 100%; height: 120px; border: 0; }
</style>
</head>
<body>
  <div id="loading">
    <div class="title">GEAR MASTER</div>
    <div class="sub">loading…</div>
  </div>
  <canvas id="glcanvas" tabindex="1"></canvas>

  <div id="music">
    <header id="music-toggle"><span>SOUNDTRACK</span><span id="music-caret">fold</span></header>
    <iframe id="sc" allow="autoplay" scrolling="no" frameborder="no"
      src="https://w.soundcloud.com/player/?url=https%3A%2F%2Fsoundcloud.com%2Fleefy5%2Fsets%2Fcountless-days-in-ableton&color=%23f0c85a&auto_play=false&hide_related=true&show_comments=false&show_user=true&show_reposts=false&show_teaser=false&visual=false"></iframe>
    <div id="vol-row">
      <button id="mute" type="button" aria-label="Mute the soundtrack">MUTE</button>
      <input id="vol" type="range" min="0" max="100" step="1" value="25"
             aria-label="Soundtrack volume">
      <span id="vol-read">25</span>
    </div>
  </div>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script src="mq_js_bundle.js"></script>
  <script>
    // The shim swaps to the canvas once the module is up; give it a beat, then
    // clear the splash and hand it keyboard focus.
    load("gearmaster.wasm?v=a9282dff487e");
    (function waitForStart() {
      const canvas = document.getElementById("glcanvas");
      if (canvas.width > 0 && canvas.height > 0) {
        document.getElementById("loading").style.display = "none";
        canvas.focus();
      } else {
        setTimeout(waitForStart, 100);
      }
    })();
    // Right-click rotates pieces, so don't let the browser menu eat it.
    document.getElementById("glcanvas")
      .addEventListener("contextmenu", e => e.preventDefault());

    // ---- soundtrack -------------------------------------------------
    // Browsers refuse to start audio before the visitor has interacted with
    // the page, so the playlist starts on the first click or keypress rather
    // than on load. Once it is going, the end of the set seeks back to the
    // first track, which is what makes it repeat.
    (function () {
      if (typeof SC === "undefined") return;
      const widget = SC.Widget(document.getElementById("sc"));
      let started = false;

      // Volume, and the reason there is a slider at all.
      //
      // setVolume was called once on READY and did not stick: READY fires when
      // the *widget* is up, which is before the sound is loaded, and the set is
      // dropped on the floor. The playlist then ran at SoundCloud's default,
      // which is full. Applying it again on PLAY is what actually takes, and
      // PLAY fires for every track, so it holds across the whole set.
      var LEVEL_KEY = "gearmaster.volume";
      var slider = document.getElementById("vol");
      var readout = document.getElementById("vol-read");
      var muteBtn = document.getElementById("mute");
      var stored = parseInt(window.localStorage.getItem(LEVEL_KEY), 10);
      // A quiet default. Somebody who wants it loud can say so once and the
      // page will remember; somebody who does not should never be shouted at.
      var level = isNaN(stored) ? 25 : Math.min(100, Math.max(0, stored));
      var muted = false;

      var ready = false;
      function apply() {
        slider.value = level;
        readout.textContent = muted ? "off" : String(level);
        muteBtn.textContent = muted ? "UNMUTE" : "MUTE";
        if (!ready) return;
        widget.setVolume(muted ? 0 : level);
      }

      slider.addEventListener("input", function () {
        level = parseInt(slider.value, 10) || 0;
        muted = false;
        window.localStorage.setItem(LEVEL_KEY, String(level));
        apply();
      });
      muteBtn.addEventListener("click", function () {
        muted = !muted;
        apply();
      });

      widget.bind(SC.Widget.Events.READY, function () {
        ready = true;
        apply();
        widget.getSounds(function (sounds) {
          var last = sounds.length - 1;
          widget.bind(SC.Widget.Events.FINISH, function () {
            // FINISH fires at the end of EVERY track, not of the whole set.
            // Seeking to the top on each one is why the first song played on
            // a loop forever. Only the last track wraps; the widget advances
            // the rest by itself.
            widget.getCurrentSoundIndex(function (i) {
              if (i >= last) {
                widget.skip(0);
                widget.play();
              }
            });
          });
        });
      });

      widget.bind(SC.Widget.Events.PLAY, apply);

      var volRow = document.getElementById("vol-row");
      function start(e) {
        // Reaching for the volume is not asking for the music to begin. This
        // has to be checked here rather than stopped at the row: the listener
        // is on `window` in the capture phase, so it has already run by the
        // time the event reaches anything inside the panel.
        if (e && e.target && volRow.contains(e.target)) return;
        if (started) return;
        started = true;
        widget.play();
        window.removeEventListener("pointerdown", start, true);
        window.removeEventListener("keydown", start, true);
      }
      // Capture phase: the canvas swallows its own events otherwise.
      window.addEventListener("pointerdown", start, true);
      window.addEventListener("keydown", start, true);

      // Folding hides the player without stopping it.
      const panel = document.getElementById("music");
      document.getElementById("music-toggle").addEventListener("click", function () {
        panel.classList.toggle("folded");
        document.getElementById("music-caret").textContent =
          panel.classList.contains("folded") ? "show" : "fold";
      });
    })();
  </script>
</body>
</html>
